name: Sync orders to Feishu

on:
  schedule:
    # every 20 minutes
    - cron: "*/20 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lark-cli
        run: npm install -g @larksuite/cli

      - name: Configure lark-cli (bot identity, no browser needed)
        run: echo "$FEISHU_APP_SECRET" | lark-cli config init --app-id "$FEISHU_APP_ID" --app-secret-stdin
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}

      - name: Run sync
        run: python3 scripts/owenshipment_feishu_sync.py
        env:
          JSONBIN_MASTER_KEY: ${{ secrets.JSONBIN_MASTER_KEY }}
